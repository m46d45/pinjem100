<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Usulan logo Pinjem100</title>
    <style>
      body { font-family: sans-serif; background: #f4f6f8; color: #1b2430; padding: 24px; }
      h1 { font-size: 20px; }
      .row { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; }
      figure { margin: 0; background: #fff; padding: 16px; border-radius: 12px; width: 220px; }
      img { width: 180px; height: 180px; display: block; }
      p { font-size: 14px; margin: 10px 0 0; }
    </style>
  </head>
  <body>
    <h1>Usulan logo Pinjem100</h1>
    <p>B terpasang di tab dan kiri nama. Kalau mau C atau D, bilang.</p>
    <div class="row">
      <figure>
        <img src="/brand/B-kurva-kas.png" alt="B kurva kas" />
        <p><strong>B — kurva kas</strong> (terpasang)</p>
      </figure>
      <figure>
        <img src="/brand/C-tiga-job.png" alt="C tiga job" />
        <p><strong>C — tiga job</strong></p>
      </figure>
      <figure>
        <img src="/brand/D-lubang-kas.png" alt="D lubang kas" />
        <p><strong>D — lubang kas</strong></p>
      </figure>
      <figure>
        <img src="/brand/A-huruf-P.png" alt="A huruf P" />
        <p><strong>A — huruf P</strong> (drop)</p>
      </figure>
    </div>
  </body>
</html>
